<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- light dark：让原生控件（下拉、日期框、滚动条）跟随当前主题底色。
       实际是日间还是夜间由 <html data-theme> 决定（见下方内联脚本 + group.css）。 -->
  <meta name="color-scheme" content="light dark">
  <!-- 主题首帧前落档：这段内联脚本先于任何 <link> 样式表执行，把偏好（localStorage
       opc:theme，无则跟随系统）写成 <html data-theme>。group.css 的 [data-theme="dark"]
       块靠它命中 —— 没有它，暗色用户会先闪一帧浅色再切过去（FOUC）。键名必须与
       theme.js 的 THEME_KEY 一致，别改成两个。 -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("opc:theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (t === "dark") document.documentElement.dataset.theme = "dark";
    })();
  </script>
  <title>OPC · 群角色工作台</title>
  <!-- 富文本正文用 vendored Quill 2.0.3（Apache-2.0，源码在 public/vendor/quill/）。
       本地打包不走 CDN：e2e 与桌面壳都要能离线跑。
       只带 quill.core.css —— 它给排版（ql-align-* / ql-indent-* / 引用 / 代码）打底，
       不注入任何工具栏外观；snow.css 刻意不引，样式一律走我们自己的 .editor-toolbar。
       ⚠ 必须在 group.css【之前】：.ql-editor 与我们的 .rich-editor 同为单类选择器，
       同权重时后到的赢（padding/height/line-height 都会翻）。
       脚本放在 group.js 之前：它是带 defer 语义的 module，晚于所有经典脚本执行，
       所以 group.js 一进来 window.Quill 必然已就位。 -->
  <link rel="stylesheet" href="/vendor/quill/quill.core.css">
  <!-- 表格正文用 vendored x-data-spreadsheet 1.1.9（MIT，见 vendor/xspreadsheet/LICENSE）。
       同样本地打包不走 CDN：e2e 与桌面壳都要离线跑。
       这条必须在 group.css【之前】：库的样式全是 .x-spreadsheet-* 前缀，与我们的 .sheet-* 不重名，
       但它给 canvas 宿主定的尺寸纪律要能被我们覆盖，同权重时后到的赢（与上面 Quill 同理）。
       ⚠ 工具栏图标是 css 里 url(58eaeb4e...svg) 那张雪碧图，相对 css 自己的路径解析 ——
       vendor 目录里必须带上那个 svg，且 dev-server 要认 .svg 的 MIME，否则图标全哑。 -->
  <link rel="stylesheet" href="/vendor/xspreadsheet/xspreadsheet.css">
  <link rel="stylesheet" href="/group.css">
  <!-- 管理视图挂进内容区后与工作台同处一份文档，样式靠 .admin-root 作用域隔离；
       这条 link 必须在 group.css 之后（同特异度按文档顺序决胜），且它是管理视图
       唯一的样式来源 —— 少了它，右侧内容区会渲染出一堆没皮的裸标记。 -->
  <link rel="stylesheet" href="/admin.css">
  <!-- 夜间主题补丁：只在 <html data-theme="dark"> 下给「管理视图」那棵 .admin-root
       子树换一组夜间 token。必须排在本文件所有其它样式表之后（同是重值，后到者赢）。
       工作台三栏的夜间值已经在 group.css 里，这里只管 admin 那半。 -->
  <link rel="stylesheet" href="/theme.css">
  <!-- Tailwind v4 预编译产物（devDependencies 里的 CLI 生成，运行时零构建，与
       vendor 同理：离线可用）。放最后【不】是因为要靠顺序决胜 —— 它的 utilities 全在
       @layer utilities 里，上面三张表是未分层规则，级联里未分层永远赢分层，放哪儿都
       压不住它们。放最后只是为了读起来「它是补充，不是地基」。
       它只补现有 CSS 没管的格子；这条性质由 test/web/tailwind-wiring.test.ts 在浏览器里量。 -->
  <link rel="stylesheet" href="/tw.css">
  <script src="/vendor/quill/quill.js"></script>
  <!-- 同上顺序纪律：经典脚本先于带 defer 语义的 module 执行，group.js 一进来
       window.x_spreadsheet 必然已就位。locale 文件自挂到 window.x_spreadsheet.$messages，
       主包只内置英文，所以 zh-cn.js 必带；不认得它也不会报错，只会退回英文工具栏。 -->
  <script src="/vendor/xspreadsheet/xspreadsheet.js"></script>
  <script src="/vendor/xspreadsheet/locale/zh-cn.js"></script>
  <script src="/group.js" type="module"></script>
</head>

  <header class="topbar">
    <a class="brand" href="#/messages" aria-label="OPC 群角色工作台首页"><span class="brand-mark">OPC</span><span class="brand-name">群角色工作台</span></a>
    <div class="global-search" role="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="globalSearch" type="search" autocomplete="off" placeholder="搜索消息、文档、群、成员、任务、会议" aria-label="全局搜索" aria-controls="searchResults" aria-expanded="false">
      <kbd>Ctrl K</kbd>
      <div id="searchPanel" class="search-panel popover" hidden>
        <div id="searchFaces" class="search-faces"></div>
        <div id="searchResults" class="search-results" role="listbox"></div>
      </div>
    </div>
    <div class="create-wrap">
      <button id="createButton" class="btn primary" type="button" aria-haspopup="menu" aria-expanded="false"><svg class="icon"><use href="#i-plus"/></svg>创建</button>
      <div id="createMenu" class="popover create-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-create="group"><svg class="icon"><use href="#i-users"/></svg><span>新建群<small>立项与协作</small></span></button>
        <button type="button" role="menuitem" data-create="document"><svg class="icon"><use href="#i-doc"/></svg><span>新建文档<small>模板或空白文档</small></span></button>
        <button type="button" role="menuitem" data-create="meeting"><svg class="icon"><use href="#i-meeting"/></svg><span>发起会议<small>按顺序发言</small></span></button>
        <button type="button" role="menuitem" data-create="boss-private"><svg class="icon"><use href="#i-chat"/></svg><span>私聊成员（老板）<small>默认 1:1 私聊入口</small></span></button>
        <button type="button" role="menuitem" data-create="member-private"><svg class="icon"><use href="#i-users"/></svg><span>私聊成员（成员间）<small>可选的双成员私聊</small></span></button>
      </div>
    </div>
    <div class="top-spacer"></div>
    <button id="themeToggleButton" class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="切换日夜间模式" title="日 / 夜"></button>
    <button id="reconnectButton" class="connection" type="button" title="点击重新连接事件流"><span id="connectionDot" class="status-dot connecting"></span><span id="connectionText">连接中…</span></button>
    <div class="profile-wrap">
      <button class="profile-button" type="button" data-nav="settings" aria-label="打开个人设置"><span id="profileStatusDot" class="status-dot online" aria-hidden="true"></span><span class="avatar boss-avatar">B</span><span class="profile-copy"><strong>老板</strong><small id="profileStatusText">在线 · 本机 · 决策人</small></span><svg class="icon"><use href="#i-down"/></svg></button>
      <select id="personalStatus" class="personal-status" aria-label="个人状态（仅本机）" title="仅保存在本机，不代表服务端在线状态"><option value="online">在线</option><option value="focus">专注</option><option value="busy">忙碌</option></select>
    </div>
  </header>

  <div class="workspace">
    <nav id="navRail" class="nav-rail" aria-label="应用导航" aria-describedby="navReorderHint">
      <div class="rail-top">
        <div class="nav-entry" draggable="true"><button class="nav-item active" type="button" data-nav="messages" aria-current="page" title="消息"><svg class="icon"><use href="#i-chat"/></svg><span>消息</span><b id="messageBadge" class="rail-badge" hidden></b></button><span class="nav-grip" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></span></div>
        <div class="nav-entry" draggable="true"><button class="nav-item" type="button" data-nav="contacts" title="通讯录"><svg class="icon"><use href="#i-users"/></svg><span>通讯录</span></button><span class="nav-grip" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></span></div>
        <div class="nav-entry" draggable="true"><button class="nav-item" type="button" data-nav="documents" title="文档中心"><svg class="icon"><use href="#i-doc"/></svg><span>文档中心</span></button><span class="nav-grip" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></span></div>
        <div class="nav-entry" draggable="true"><button class="nav-item" type="button" data-nav="backlog" title="任务面板"><svg class="icon"><use href="#i-board"/></svg><span>任务面板</span></button><span class="nav-grip" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></span></div>
        <div class="nav-entry" draggable="true"><button class="nav-item" type="button" data-nav="talent" title="人才市场"><svg class="icon"><use href="#i-talent"/></svg><span>人才市场</span></button><span class="nav-grip" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></span></div>
        <div class="nav-entry" draggable="true"><button class="nav-item" type="button" data-nav="settings" title="设置"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></button><span class="nav-grip" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></span></div>
        <div class="nav-entry" draggable="true"><button class="nav-item" type="button" data-nav="admin" title="管理视图"><svg class="icon"><use href="#i-admin"/></svg><span>管理视图</span></button><span class="nav-grip" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></span></div>
      </div>
      <div class="rail-bottom">
        <p id="navReorderHint" class="rail-hint">拖拽排序<br>Alt + ↑ / ↓</p>
        <button id="collapseNav" class="icon-button rail-collapse" type="button" aria-label="折叠导航" aria-expanded="true" title="折叠导航"><svg class="icon"><use href="#i-panel"/></svg></button>
      </div>
    </nav>

    <aside id="listPane" class="list-pane" aria-label="内容列表">
      <div class="list-heading"><div><h1 id="listTitle">消息</h1><p id="listSubtitle">群聊、私聊与会议</p></div><button id="listAction" class="icon-button" type="button" aria-label="列表操作" title="列表操作"><svg class="icon"><use href="#i-plus"/></svg></button></div>
      <div id="listToolbar" class="list-toolbar"></div>
      <div id="listContent" class="list-content" aria-live="polite"></div>
    </aside>

    <main id="mainPane" class="main-pane" tabindex="-1">
      <div id="view" class="view"></div>
    </main>
    <button id="mobileListButton" class="mobile-list-button" type="button" aria-label="显示内容列表"><svg class="icon"><use href="#i-panel"/></svg></button>
  </div>

  <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <form id="modalForm" method="dialog">
      <header class="modal-header"><div><p id="modalEyebrow" class="eyebrow"></p><h2 id="modalTitle"></h2></div><button id="modalClose" class="icon-button" type="button" aria-label="关闭对话框"><svg class="icon"><use href="#i-close"/></svg></button></header>
      <div id="modalBody" class="modal-body"></div>
      <footer class="modal-footer"><span id="modalError" class="form-error" role="alert"></span><button id="modalCancel" class="btn" type="button">取消</button><button id="modalSubmit" class="btn primary" type="submit">确认</button></footer>
    </form>
  </dialog>
  <noscript><div class="noscript">此工作台需要 JavaScript。请启用后刷新页面。</div></noscript>
</body>
</html>
